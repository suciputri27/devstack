modelRoles:
  default: nr/code-main
  task: nr/code-main
  smol: nr/code-fast
  tiny: nr/code-fast
  commit: nr/code-fast
  slow: nr/code-heavy:high
  plan: nr/code-heavy:high
  designer: nr/code-design:medium
  vision: nr/code-vision
  advisor: nr/code-review:medium
cycleOrder:
  - smol
  - default
  - slow
defaultThinkingLevel: medium
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - nr/code-heavy
    plan:
      - nr/code-design
    slow:
      - nr/code-design
    designer:
      - nr/code-heavy
    advisor:
      - nr/code-heavy
    smol:
      - nr/code-main
advisor:
  enabled: false
tools:
  format: auto
  approvalMode: write
  approval:
    bash: allow
bash:
  patterns:
    - match: rm -rf *
      approval: deny
    - match: git push --force*
      approval: deny
    - match: git reset --hard*
      approval: prompt
    - match: git push*
      approval: prompt
    - match: php artisan migrate:fresh*
      approval: deny
    - match: php artisan db:wipe*
      approval: deny
    - match: php artisan migrate*
      approval: prompt
    - match: docker compose down -v*
      approval: deny
    - match: sudo *
      approval: prompt
    - match: "*"
      approval: allow
secrets:
  enabled: true
lsp:
  enabled: true
  diagnosticsOnWrite: true
  formatOnWrite: false
edit:
  mode: hashline
  blockAutoGenerated: true
memory:
  backend: local
skills:
  enableSkillCommands: true
setupVersion: 3
