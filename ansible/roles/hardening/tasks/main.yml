- name: Konfigurasi SSH
  ansible.builtin.template:
    src: 99-devstack.conf.j2
    dest: /etc/ssh/sshd_config.d/99-devstack.conf
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload ssh

- name: Firewall default
  community.general.ufw:
    direction: "{{ item.direction }}"
    default: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Port yang harus terbuka ke publik (PUBLIC_PORTS)
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] | default('any') }}"
  loop: "{{ public_ports }}"

- name: SSH, 9Router, SearXNG hanya dari subnet yang diizinkan
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1 | string }}"
    proto: tcp
  loop: "{{ allowed_subnets | product([22, ninerouter_port] + ([searxng_port] if enable_searxng | bool else [])) | list }}"

- name: SSH terbuka dari mana saja (SSH_RESTRICTED=false)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
  when: not (ssh_restricted | bool)

- name: Tutup SSH publik (SSH_RESTRICTED=true)
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    delete: true
  when: ssh_restricted | bool

- name: Aktifkan firewall
  community.general.ufw:
    state: enabled
